name: Bun CI

on:
  pull_request:
    paths:
      - ".github/workflows/validate-wordlists.yml"
      - "wordlists/README.md"
      - "wordlists/config.toml"
      - "wordlists/00_rules/**"
      - "wordlists/10_sources/**"
      - "wordlists/20_working/**"
      - "wordlists/30_curated/**"
      - "wordlists/40_build/**"
      - "wordlists/90_scripts/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/validate-wordlists.yml"
      - "wordlists/README.md"
      - "wordlists/config.toml"
      - "wordlists/00_rules/**"
      - "wordlists/10_sources/**"
      - "wordlists/20_working/**"
      - "wordlists/30_curated/**"
      - "wordlists/40_build/**"
      - "wordlists/90_scripts/**"
      - "src/**"
      - "package.json"
      - "bun.lock"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Validate curated wordlists
        run: bun run wordlists:validate

      - name: Build normalized single-set wordlists
        run: bun run wordlists:build

      - name: Lint
        run: bun run lint
